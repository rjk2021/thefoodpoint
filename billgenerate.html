
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Food Point - Billing</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


    <style>

        body {
            background-color: #f5f5f5;
        }


        .header {
            background: #198754;
            color: white;
            padding: 25px;
            text-align: center;
            border-radius: 0 0 15px 15px;
        }


        .header h2 {
            margin-bottom: 5px;
            font-weight: bold;
        }


        .header p {
            margin-bottom: 3px;
        }


        .billing-card {
            max-width: 900px;
            margin: 30px auto;
        }


        .total-box {
            background: #e9f7ef;
            border-radius: 10px;
            padding: 20px;
        }


        .total-amount {
            font-size: 28px;
            font-weight: bold;
            color: #198754;
        }


        .table th {
            background-color: #198754;
            color: white;
        }


        .empty-message {
            text-align: center;
            color: #888;
            padding: 30px;
        }


        .currency {
            font-weight: bold;
        }

    </style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<div class="header">

    <h2>The Food Point</h2>

    <p>Daily Food & Meal Packages</p>

    <p>
        FSSAI Approved |
        License No: 20824005002667
    </p>


    <a
        href="index.html"
        class="btn btn-light btn-sm mt-2"
    >
        ← Main Menu
    </a>

</div>



<div class="container billing-card">


    <!-- ==========================================
         BILL INFORMATION
    =========================================== -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h4 class="mb-3">
                Create Customer Bill
            </h4>


            <div class="row">


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Customer Name
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        class="form-control"
                        placeholder="Enter customer name"
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Bill Date
                    </label>

                    <input
                        type="date"
                        id="billDate"
                        class="form-control"
                    >

                </div>


            </div>

        </div>

    </div>



    <!-- ==========================================
         ADD ITEM
    =========================================== -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h5 class="mb-3">
                Add Item
            </h5>


            <div class="row align-items-end">


                <div class="col-md-7 mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <input
                        type="text"
                        id="itemDescription"
                        class="form-control"
                        placeholder="Example: Roti Combo"
                    >

                </div>



                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Price (₹)
                    </label>

                    <input
                        type="number"
                        id="itemPrice"
                        class="form-control"
                        placeholder="80"
                        min="0"
                        step="0.01"
                    >

                </div>



                <div class="col-md-2 mb-3">

                    <button
                        type="button"
                        class="btn btn-success w-100"
                        onclick="addItem()"
                    >
                        + Add Item
                    </button>

                </div>


            </div>

        </div>

    </div>



    <!-- ==========================================
         ITEMS LIST
    =========================================== -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h5 class="mb-3">
                Bill Items
            </h5>


            <div class="table-responsive">

                <table
                    class="table table-bordered align-middle"
                >

                    <thead>

                        <tr>

                            <th style="width: 60px;">
                                #
                            </th>

                            <th>
                                Description
                            </th>

                            <th style="width: 150px;">
                                Price
                            </th>

                            <th style="width: 180px;">
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="itemsTable">

                    </tbody>

                </table>

            </div>


            <div
                id="emptyMessage"
                class="empty-message"
            >
                No items added yet.
            </div>

        </div>

    </div>



    <!-- ==========================================
         TOTAL
    =========================================== -->

    <div class="total-box shadow-sm mb-4">

        <div class="row align-items-center">

            <div class="col-md-8">

                <h5 class="mb-0">
                    Total Amount
                </h5>

            </div>


            <div class="col-md-4 text-md-end">

                <div
                    id="totalAmount"
                    class="total-amount"
                >
                    ₹0.00
                </div>

            </div>

        </div>

    </div>



    <!-- ==========================================
         BUTTONS
    =========================================== -->

    <div class="text-center mb-5">

<button
    type="button"
    class="btn btn-primary btn-lg me-2"
    onclick="downloadBill()"
>
    ⬇ Download Bill
</button>

<button
    type="button"
    class="btn btn-success btn-lg me-2"
    onclick="copyBill()"
>
    📋 Copy Bill
</button>

<button
    type="button"
    class="btn btn-outline-danger btn-lg"
    onclick="clearBill()"
>
    Clear Bill
</button>


    </div>


</div>



<script>


/* ==========================================
   BILL ITEMS
========================================== */

let items = [];



/* ==========================================
   TODAY'S DATE
========================================== */

document.getElementById("billDate").value =
    new Date().toISOString().split("T")[0];



/* ==========================================
   ADD ITEM
========================================== */

function addItem() {

    const description =
        document
            .getElementById("itemDescription")
            .value
            .trim();


    const price =
        parseFloat(
            document.getElementById("itemPrice").value
        );


    if (description === "") {

        alert("Please enter item description.");

        return;

    }


    if (isNaN(price) || price < 0) {

        alert("Please enter a valid price.");

        return;

    }


    items.push({

        description: description,

        price: price

    });


    document.getElementById(
        "itemDescription"
    ).value = "";


    document.getElementById(
        "itemPrice"
    ).value = "";


    displayItems();

}



/* ==========================================
   DISPLAY ITEMS
========================================== */

function displayItems() {

    const table =
        document.getElementById("itemsTable");


    const emptyMessage =
        document.getElementById("emptyMessage");


    table.innerHTML = "";


    if (items.length === 0) {

        emptyMessage.style.display = "block";

    } else {

        emptyMessage.style.display = "none";

    }


    items.forEach((item, index) => {


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>
                ${escapeHtml(item.description)}
            </td>

            <td class="currency">
                ₹${item.price.toFixed(2)}
            </td>

            <td>

                <button
                    class="btn btn-sm btn-warning me-1"
                    onclick="editItem(${index})"
                >
                    Edit
                </button>


                <button
                    class="btn btn-sm btn-danger"
                    onclick="deleteItem(${index})"
                >
                    Delete
                </button>

            </td>

        `;


        table.appendChild(row);

    });


    calculateTotal();

}



/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}



/* ==========================================
   EDIT ITEM
========================================== */

function editItem(index) {

    const item = items[index];


    const newDescription =
        prompt(
            "Enter item description:",
            item.description
        );


    if (newDescription === null) {

        return;

    }


    const newPrice =
        prompt(
            "Enter price:",
            item.price
        );


    if (newPrice === null) {

        return;

    }


    const price =
        parseFloat(newPrice);


    if (
        newDescription.trim() === "" ||
        isNaN(price) ||
        price < 0
    ) {

        alert(
            "Please enter valid information."
        );

        return;

    }


    items[index] = {

        description:
            newDescription.trim(),

        price: price

    };


    displayItems();

}



/* ==========================================
   DELETE ITEM
========================================== */

function deleteItem(index) {

    if (
        confirm(
            "Are you sure you want to delete this item?"
        )
    ) {

        items.splice(index, 1);

        displayItems();

    }

}



/* ==========================================
   CALCULATE TOTAL
========================================== */

function calculateTotal() {

    let total = 0;


    items.forEach(item => {

        total += item.price;

    });


    document.getElementById(
        "totalAmount"
    ).innerText =
        "₹" + total.toFixed(2);

}



/* ==========================================
   CLEAR BILL
========================================== */

function clearBill() {

    if (items.length === 0) {

        return;

    }


    if (
        confirm(
            "Are you sure you want to clear this bill?"
        )
    ) {

        items = [];


        document.getElementById(
            "customerName"
        ).value = "";


        displayItems();

    }

}



/* ==========================================
   LOAD NOTO SANS FONT
========================================== */

async function loadNotoSansFont() {

    try {

        const response =
            await fetch(
                "assets/fonts/NotoSans-Regular.ttf"
            );


        if (!response.ok) {

            throw new Error(
                "Noto Sans font could not be loaded."
            );

        }


        const arrayBuffer =
            await response.arrayBuffer();


        const uint8Array =
            new Uint8Array(arrayBuffer);


        let binaryString = "";


        const chunkSize = 8192;


        for (
            let i = 0;
            i < uint8Array.length;
            i += chunkSize
        ) {

            const chunk =
                uint8Array.subarray(
                    i,
                    Math.min(
                        i + chunkSize,
                        uint8Array.length
                    )
                );


            binaryString += String.fromCharCode(
                ...chunk
            );

        }


        return binaryString;

    }

    catch (error) {

        console.error(
            "Font loading error:",
            error
        );


        return null;

    }

}



/* ==========================================
   DOWNLOAD BILL
========================================== */

async function downloadBill() {


    if (items.length === 0) {

        alert(
            "Please add at least one item before downloading the bill."
        );

        return;

    }


    const customerName =
        document
            .getElementById("customerName")
            .value
            .trim()
        || "Customer";


    const billDate =
        document.getElementById(
            "billDate"
        ).value;


    const downloadButton =
        document.querySelector(
            'button[onclick="downloadBill()"]'
        );


    downloadButton.disabled = true;

    downloadButton.innerText =
        "Creating PDF...";


    try {


        /* ------------------------------------------
           Get jsPDF
        ------------------------------------------ */

        const {
            jsPDF
        } = window.jspdf;


        const doc =
            new jsPDF({
                orientation: "portrait",
                unit: "mm",
                format: "a4"
            });



        /* ------------------------------------------
           Load Noto Sans
        ------------------------------------------ */

        const notoSans =
            await loadNotoSansFont();


        if (!notoSans) {

            alert(
                "Noto Sans font could not be loaded.\n\n" +
                "Please make sure this file exists:\n" +
                "fonts/NotoSans-Regular.ttf"
            );


            return;

        }


        /* ------------------------------------------
           Add Noto Sans to jsPDF
        ------------------------------------------ */

        doc.addFileToVFS(
            "NotoSans-Regular.ttf",
            notoSans
        );


        doc.addFont(
            "NotoSans-Regular.ttf",
            "NotoSans",
            "normal"
        );


        /* ------------------------------------------
           Use Noto Sans
        ------------------------------------------ */

        doc.setFont(
            "NotoSans",
            "normal"
        );


        /* ------------------------------------------
           Page dimensions
        ------------------------------------------ */

        const pageWidth =
            doc.internal.pageSize.getWidth();


        const pageHeight =
            doc.internal.pageSize.getHeight();



        /* ------------------------------------------
           HEADER
        ------------------------------------------ */

        doc.setFillColor(
            25,
            135,
            84
        );


        doc.rect(
            0,
            0,
            pageWidth,
            42,
            "F"
        );


        doc.setTextColor(
            255,
            255,
            255
        );


        doc.setFontSize(20);


        doc.text(
            "The Food Point",
            pageWidth / 2,
            15,
            {
                align: "center"
            }
        );


        doc.setFontSize(11);


        doc.text(
            "Daily Food & Meal Packages",
            pageWidth / 2,
            23,
            {
                align: "center"
            }
        );


        doc.setFontSize(9);


        doc.text(
            "FSSAI Approved | License No: 20824005002667",
            pageWidth / 2,
            31,
            {
                align: "center"
            }
        );


        /* ------------------------------------------
           RESET TEXT COLOR
        ------------------------------------------ */

        doc.setTextColor(
            0,
            0,
            0
        );


        /* ------------------------------------------
           BILL INFORMATION
        ------------------------------------------ */

        doc.setFontSize(11);


        doc.text(
            "Customer: " + customerName,
            15,
            55
        );


        doc.text(
            "Date: " + billDate,
            pageWidth - 15,
            55,
            {
                align: "right"
            }
        );


        /* ------------------------------------------
           TABLE HEADER
        ------------------------------------------ */

        let y = 70;


        doc.setFillColor(
            25,
            135,
            84
        );


        doc.rect(
            15,
            y - 6,
            pageWidth - 30,
            10,
            "F"
        );


        doc.setTextColor(
            255,
            255,
            255
        );


        doc.setFontSize(10);


        doc.text(
            "#",
            20,
            y
        );


        doc.text(
            "Description",
            35,
            y
        );


        doc.text(
            "Price",
            pageWidth - 20,
            y,
            {
                align: "right"
            }
        );


        /* ------------------------------------------
           TABLE ITEMS
        ------------------------------------------ */

        y += 12;


        doc.setTextColor(
            0,
            0,
            0
        );


        doc.setFontSize(10);


        let total = 0;


        items.forEach((item, index) => {


            /* New page if needed */

            if (y > pageHeight - 35) {

                doc.addPage();

                y = 25;

            }


            /* Alternate row background */

            if (index % 2 === 0) {

                doc.setFillColor(
                    245,
                    245,
                    245
                );


                doc.rect(
                    15,
                    y - 6,
                    pageWidth - 30,
                    9,
                    "F"
                );

            }


            doc.setTextColor(
                0,
                0,
                0
            );


            doc.text(
                String(index + 1),
                20,
                y
            );


            /*
                Split long descriptions
                so they don't run outside PDF.
            */

            const descriptionLines =
                doc.splitTextToSize(
                    item.description,
                    120
                );


            doc.text(
                descriptionLines,
                35,
                y
            );


            doc.text(
                "₹" +
                item.price.toFixed(2),
                pageWidth - 20,
                y,
                {
                    align: "right"
                }
            );


            total += item.price;


            y +=
                Math.max(
                    9,
                    descriptionLines.length * 5
                );

        });



        /* ------------------------------------------
           TOTAL
        ------------------------------------------ */

        y += 5;


        doc.setDrawColor(
            25,
            135,
            84
        );


        doc.line(
            15,
            y,
            pageWidth - 15,
            y
        );


        y += 12;


        doc.setFontSize(14);


        doc.text(
            "TOTAL",
            pageWidth - 70,
            y
        );


        doc.text(
            "₹" + total.toFixed(2),
            pageWidth - 20,
            y,
            {
                align: "right"
            }
        );



        /* ------------------------------------------
           THANK YOU MESSAGE
        ------------------------------------------ */

        y += 20;


        doc.setFontSize(10);


        doc.text(
            "Thank you for choosing The Food Point!",
            pageWidth / 2,
            y,
            {
                align: "center"
            }
        );


        y += 6;


        doc.text(
            "We appreciate your business.",
            pageWidth / 2,
            y,
            {
                align: "center"
            }
        );



        /* ------------------------------------------
           FOOTER
        ------------------------------------------ */

        doc.setFontSize(8);


        doc.setTextColor(
            100,
            100,
            100
        );


        doc.text(
            "The Food Point | FSSAI License No. 20824005002667",
            pageWidth / 2,
            pageHeight - 10,
            {
                align: "center"
            }
        );



        /* ------------------------------------------
           SAVE PDF
        ------------------------------------------ */

        doc.save(
            "The-Food-Point-Bill.pdf"
        );


    }

    catch (error) {

        console.error(
            "PDF generation error:",
            error
        );


        alert(
            "There was an error creating the PDF.\n\n" +
            "Please check that NotoSans-Regular.ttf exists inside the fonts folder."
        );

    }

    finally {

        downloadButton.disabled = false;

        downloadButton.innerText =
            "⬇ Download Bill";

    }

}


function copyBill() {

    if (items.length === 0) {

        alert("Please add at least one item before copying the bill.");

        return;

    }


    const customerName =
        document.getElementById("customerName").value.trim()
        || "Customer";


    const billDate =
        document.getElementById("billDate").value;


    let total = 0;


    let billText =
        "THE FOOD POINT\n" +
        "Daily Food & Meal Packages\n" +
        "FSSAI Approved | License No: 20824005002667\n\n";


    billText +=
        "Customer: " + customerName + "\n";


    billText +=
        "Date: " + billDate + "\n\n";


    billText +=
        "BILL DETAILS\n";


    billText +=
        "------------------------------\n";


    items.forEach((item, index) => {

        billText +=
            (index + 1) +
            ". " +
            item.description +
            " - ₹" +
            item.price.toFixed(2) +
            "\n";


        total += item.price;

    });


    billText +=
        "------------------------------\n";


    billText +=
        "TOTAL: ₹" +
        total.toFixed(2) +
        "\n\n";


    billText +=
        "Thank you for choosing The Food Point!\n";


    billText +=
        "We appreciate your business.";


    navigator.clipboard.writeText(billText)
        .then(() => {

            alert(
                "Bill copied successfully! You can now paste it into WhatsApp."
            );

        })
        .catch((error) => {

            console.error(
                "Copy failed:",
                error
            );


            alert(
                "Unable to copy the bill. Please try again."
            );

        });

}
/* ==========================================
   INITIAL DISPLAY
========================================== */

displayItems();

</script>


</body>

</html>
